<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Consultum</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: rgba(255,255,255,0.07);
      --text: #e8e4de;
      --muted: rgba(232,228,222,0.45);
      --accent: #c8a96e;
      --linkedin: #0A66C2;
      --linkedin-dim: rgba(10,102,194,0.12);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 3rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
      z-index: 0;
    }

    .logo-wrap {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(-12px);
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }

    .logo-wrap img {
      max-width: 320px;
      width: 100%;
      display: block;
    }

    .divider {
      position: relative;
      z-index: 1;
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem 2.5rem 2rem;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.4s forwards;
      text-align: center;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.9rem;
    }

    .card-intro {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.85rem 1rem;
      background: transparent;
      border: 1px solid var(--linkedin);
      color: #5b9fd6;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-linkedin:hover {
      background: var(--linkedin-dim);
      color: #82b8e8;
    }

    .btn-linkedin:active { transform: scale(0.99); }
    .btn-linkedin svg { flex-shrink: 0; opacity: 0.85; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .card { padding: 2rem 1.5rem 1.5rem; }
      .logo-wrap img { max-width: 240px; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="https://audioconsultum.nl/audioconsultum-logo-3.png" alt="Audio Consultum" />
  </div>

  <div class="divider"></div>

  <div class="card">
    <p class="card-title">Neem contact op</p>
    <p class="card-intro">Stuur mij een bericht via LinkedIn — ik reageer zo snel mogelijk.</p>

    <a class="btn-linkedin" href="https://www.linkedin.com/in/bakkerwillem/" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      Verbinden op LinkedIn
    </a>
  </div>

</body>
</html>
